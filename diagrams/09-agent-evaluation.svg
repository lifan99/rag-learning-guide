<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
<title id="title">09  统一评测：回答是否正确，事情是否真的办成</title><desc id="desc">先固定输入与成功条件，再分别检查检索、生成、工具执行和最终业务结果。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#54758a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.h{font-size:31px;font-weight:700;fill:#15324f}.s{font-size:18px;fill:#586f80}.t{font-size:23px;font-weight:650;fill:#15324f}.b{font-size:19px;fill:#233c50}.label{font-size:17px;fill:#087e8b;font-weight:700}</style>
<rect width="1440" height="1100" fill="#f8fafc"/><rect width="1440" height="8" fill="#087e8b"/>
<text x="55" y="64" class="h">09  统一评测：回答是否正确，事情是否真的办成</text><text x="55" y="105" class="s">先固定输入与成功条件，再分别检查检索、生成、工具执行和最终业务结果。</text>
<rect x="35" y="150" width="1370" height="240" rx="18" fill="#edf5fa"/><text x="58" y="183" class="label">实验输入 · 固定数据、模型与配置</text>
<rect x="60" y="205" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="60" y="219" width="5" height="132" rx="2" fill="#087e8b"/><text x="80" y="241" class="t">RAG 样例</text>
<text x="80" y="275" class="b">单文档 / 多文档 / 无答案</text>
<text x="80" y="303" class="b">有效版本、引用与访问范围</text>
<text x="80" y="331" class="b">开发集与验收集按事件分离</text>
<path d="M467 285 H511" fill="none" stroke="#54758a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="515" y="205" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="515" y="219" width="5" height="132" rx="2" fill="#087e8b"/><text x="535" y="241" class="t">Agent 场景</text>
<text x="535" y="275" class="b">办理成功 / 拒绝 / 条件不满足</text>
<text x="535" y="303" class="b">工具失败 / 中断恢复 / 越权</text>
<text x="535" y="331" class="b">初始数据库状态保持一致</text>
<path d="M922 285 H966" fill="none" stroke="#54758a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="970" y="205" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="970" y="219" width="5" height="132" rx="2" fill="#087e8b"/><text x="990" y="241" class="t">实验清单</text>
<text x="990" y="275" class="b">模型、提示、索引和代码版本</text>
<text x="990" y="303" class="b">相同题目可重复运行多次</text>
<text x="990" y="331" class="b">保存每次试验的 run_id</text>
<rect x="35" y="425" width="1370" height="240" rx="18" fill="#edf6f2"/><text x="58" y="458" class="label">执行证据 · 结果与过程一起保存</text>
<rect x="60" y="480" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="60" y="494" width="5" height="132" rx="2" fill="#087e8b"/><text x="80" y="516" class="t">检索与回答</text>
<text x="80" y="550" class="b">候选、上下文、JSON、引用</text>
<text x="80" y="578" class="b">Recall / 条件完整 / 拒答</text>
<text x="80" y="606" class="b">人工检查模型裁判评分</text>
<path d="M467 560 H511" fill="none" stroke="#54758a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="515" y="480" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="515" y="494" width="5" height="132" rx="2" fill="#087e8b"/><text x="535" y="516" class="t">工具与业务</text>
<text x="535" y="550" class="b">调用名称、参数、返回与重试</text>
<text x="535" y="578" class="b">任务完成由业务表状态验证</text>
<text x="535" y="606" class="b">重复提交、权限和恢复单独检验</text>
<path d="M922 560 H966" fill="none" stroke="#54758a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="970" y="480" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="970" y="494" width="5" height="132" rx="2" fill="#087e8b"/><text x="990" y="516" class="t">运行成本</text>
<text x="990" y="550" class="b">首字时间与总耗时分别记录</text>
<text x="990" y="578" class="b">调用数、输入输出 token</text>
<text x="990" y="606" class="b">有价格快照后计算费用</text>
<rect x="35" y="700" width="1370" height="240" rx="18" fill="#fff6e9"/><text x="58" y="733" class="label">交付决定 · 把指标变成可说明的选择</text>
<rect x="60" y="755" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="60" y="769" width="5" height="132" rx="2" fill="#087e8b"/><text x="80" y="791" class="t">对照与归因</text>
<text x="80" y="825" class="b">一次改变一个主要因素</text>
<text x="80" y="853" class="b">看改善题，也看退化题</text>
<text x="80" y="881" class="b">区分检索、上下文与执行失败</text>
<path d="M467 835 H511" fill="none" stroke="#54758a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="515" y="755" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="515" y="769" width="5" height="132" rx="2" fill="#087e8b"/><text x="535" y="791" class="t">发布门槛</text>
<text x="535" y="825" class="b">先定范围、阈值与样本量</text>
<text x="535" y="853" class="b">关键规则失败应阻止发布</text>
<text x="535" y="881" class="b">性能随代表性负载验证</text>
<path d="M922 835 H966" fill="none" stroke="#54758a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="970" y="755" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="970" y="769" width="5" height="132" rx="2" fill="#087e8b"/><text x="990" y="791" class="t">项目与面试</text>
<text x="990" y="825" class="b">一题演示完整数据流</text>
<text x="990" y="853" class="b">一个实验说明收益与代价</text>
<text x="990" y="881" class="b">一个故障展示定位和恢复</text>
<rect x="55" y="1000" width="1330" height="65" rx="12" fill="#e7eff4"/>
<text x="78" y="1040" class="s">模拟场景通过证明程序规则；真实模型质量、费用和吞吐量需要在选定服务与负载上另行测量。</text></svg>