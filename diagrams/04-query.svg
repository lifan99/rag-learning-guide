<text x="55" y="94" class="sub">权限过滤覆盖所有检索通道；证据不足与系统故障使用不同的状态返回。</text>
<rect x="35" y="135" width="1370" height="365" rx="20" fill="#eef5fa"/><text x="57" y="165" class="small" font-weight="700">候选召回 · 两路检索使用相同的授权范围</text>
