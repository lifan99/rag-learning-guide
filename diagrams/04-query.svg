<text x="551" y="840" class="body" text-anchor="start">出处必须映射到真实片段</text>
<text x="551" y="867" class="body" text-anchor="start">关键结论抽查 / 自动辅助</text>
<rect x="1000" y="775" width="380" height="120" rx="13" fill="#ffffff" stroke="#c6dce4" stroke-width="1.5"/><rect x="1000" y="790" width="5" height="90" rx="2" fill="#087e8b"/>
<text x="1021" y="810" class="cardtitle" text-anchor="start">回答与引用展示</text>
<text x="1021" y="840" class="body" text-anchor="start">答案 + 可访问的原文位置</text>
<text x="1021" y="867" class="body" text-anchor="start">输出前复核授权，记录状态</text>
