<text x="81" y="300" class="body" text-anchor="start">身份由服务端验证</text>
<text x="81" y="327" class="body" text-anchor="start">tenant + ACL + 有效版本</text>
<text x="81" y="354" class="body" text-anchor="start">查询文本、历史与长度约束</text>
