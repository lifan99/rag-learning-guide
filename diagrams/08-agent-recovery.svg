<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
<title id="title">08  可恢复 Agent：模型提出动作，执行器维护业务状态</title><desc id="desc">同一培训补贴案例：查询制度与个人额度 → 准备 900 元申请 → 确认后写入本地业务库。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#54758a" stroke-width="1.5"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}.h{font-size:31px;font-weight:700;fill:#15324f}.s{font-size:18px;fill:#586f80}.t{font-size:23px;font-weight:650;fill:#15324f}.b{font-size:19px;fill:#233c50}.label{font-size:17px;fill:#087e8b;font-weight:700}</style>
<rect width="1440" height="1100" fill="#f8fafc"/><rect width="1440" height="8" fill="#087e8b"/>
<text x="55" y="64" class="h">08  可恢复 Agent：模型提出动作，执行器维护业务状态</text><text x="55" y="105" class="s">同一培训补贴案例：查询制度与个人额度 → 准备 900 元申请 → 确认后写入本地业务库。</text>
<rect x="35" y="150" width="1370" height="240" rx="18" fill="#edf5fa"/><text x="58" y="183" class="label">ReAct 工具循环 · Action → 执行 → Observation → 下一轮或停止</text>
<rect x="60" y="205" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="60" y="219" width="5" height="132" rx="2" fill="#087e8b"/><text x="80" y="241" class="t">目标与可信身份</text>
<text x="80" y="275" class="b">当前问题、已有事实与运行 ID</text>
<text x="80" y="303" class="b">身份由服务端注入工具</text>
<text x="80" y="331" class="b">步骤上限 / 协作式时间预算</text>
<path d="M467 285 H511" fill="none" stroke="#54758a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="515" y="205" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="515" y="219" width="5" height="132" rx="2" fill="#087e8b"/><text x="535" y="241" class="t">模型或受控决策器</text>
<text x="535" y="275" class="b">选择工具及结构化参数</text>
<text x="535" y="303" class="b">结合工具结果继续决策</text>
<text x="535" y="331" class="b">live / scripted 明确区分</text>
<path d="M922 285 H966" fill="none" stroke="#54758a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="970" y="205" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="970" y="219" width="5" height="132" rx="2" fill="#087e8b"/><text x="990" y="241" class="t">工具执行器</text>
<text x="990" y="275" class="b">工具白名单与参数校验</text>
<text x="990" y="303" class="b">查询权限与业务条件</text>
<text x="990" y="331" class="b">记录调用、结果和错误</text>
<rect x="35" y="425" width="1370" height="240" rx="18" fill="#edf6f2"/><text x="58" y="458" class="label">关键状态 · SQLite 持久化；失败或预算耗尽另以 failed / budget_exhausted 退出</text>
<rect x="60" y="480" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="60" y="494" width="5" height="132" rx="2" fill="#087e8b"/><text x="80" y="516" class="t">running</text>
<text x="80" y="550" class="b">已完成工具结果进入 journal</text>
<text x="80" y="578" class="b">当前运行状态写入数据库</text>
<text x="80" y="606" class="b">只读 MCP 工具可提供事实</text>
<path d="M467 560 H511" fill="none" stroke="#54758a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="515" y="480" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="515" y="494" width="5" height="132" rx="2" fill="#087e8b"/><text x="535" y="516" class="t">awaiting_confirmation</text>
<text x="535" y="550" class="b">展示金额、依据与申请草稿</text>
<text x="535" y="578" class="b">等待与当前运行绑定的确认</text>
<text x="535" y="606" class="b">尚未创建业务申请</text>
<path d="M922 560 H966" fill="none" stroke="#54758a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="970" y="480" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="970" y="494" width="5" height="132" rx="2" fill="#087e8b"/><text x="990" y="516" class="t">completed / rejected</text>
<text x="990" y="550" class="b">确认后按 run_id 幂等提交</text>
<text x="990" y="578" class="b">保存申请编号与执行结果</text>
<text x="990" y="606" class="b">拒绝则保持业务表无新增</text>
<rect x="35" y="700" width="1370" height="240" rx="18" fill="#fff6e9"/><text x="58" y="733" class="label">恢复演练 · 验证最终状态</text>
<rect x="60" y="755" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="60" y="769" width="5" height="132" rx="2" fill="#087e8b"/><text x="80" y="791" class="t">模拟进程中断</text>
<text x="80" y="825" class="b">读工具完成后中断</text>
<text x="80" y="853" class="b">业务提交后返回前中断</text>
<text x="80" y="881" class="b">关闭后重新打开同一数据库</text>
<path d="M467 835 H511" fill="none" stroke="#54758a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="515" y="755" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="515" y="769" width="5" height="132" rx="2" fill="#087e8b"/><text x="535" y="791" class="t">恢复同一次运行</text>
<text x="535" y="825" class="b">读取 journal 与已有申请</text>
<text x="535" y="853" class="b">重复确认复用同一申请编号</text>
<text x="535" y="881" class="b">外部服务写入需自己的幂等协议</text>
<path d="M922 835 H966" fill="none" stroke="#54758a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="970" y="755" width="405" height="160" rx="12" fill="white" stroke="#c6dce4" stroke-width="1.5"/><rect x="970" y="769" width="5" height="132" rx="2" fill="#087e8b"/><text x="990" y="791" class="t">评测与追踪</text>
<text x="990" y="825" class="b">业务表是否真的只有一条申请</text>
<text x="990" y="853" class="b">身份、参数与停止原因是否正确</text>
<text x="990" y="881" class="b">逐次事件通过 run_id 关联</text>
<path d="M1180 365 V411 H715 V365" fill="none" stroke="#087e8b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="806" y="381" width="345" height="23" rx="4" fill="#f8fafc"/><text x="816" y="399" class="s">Observation 写回历史，进入下一轮</text>
<rect x="55" y="1000" width="1330" height="65" rx="12" fill="#e7eff4"/>
<text x="78" y="1040" class="s">MCP 负责连接与工具交换；业务授权、确认、幂等和恢复规则由应用实现。</text></svg>